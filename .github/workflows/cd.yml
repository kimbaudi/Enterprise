name: CD - Deployment Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline", "Docker Build and Push"]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://staging.enterprise-api.example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}
        
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME_STAGING }}
        images: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
        
    - name: Run database migrations
      run: |
        # Add migration commands here if not handled by app startup
        echo "Database migrations would run here"
        
    - name: Health check
      run: |
        echo "Waiting for deployment to complete..."
        sleep 30
        curl -f https://staging.enterprise-api.example.com/health || exit 1
        
    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Staging deployment ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ deploy-staging ]
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') || (github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main')
    environment:
      name: production
      url: https://api.enterprise.example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PRODUCTION }}
        
    - name: Blue-Green Deployment - Switch to staging slot
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}
        slot-name: staging
        images: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
        
    - name: Health check on staging slot
      run: |
        echo "Waiting for staging slot deployment..."
        sleep 30
        curl -f https://${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}-staging.azurewebsites.net/health || exit 1
        
    - name: Swap staging to production
      uses: azure/CLI@v1
      with:
        inlineScript: |
          az webapp deployment slot swap \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }} \
            --slot staging \
            --target-slot production
            
    - name: Production health check
      run: |
        echo "Verifying production deployment..."
        sleep 30
        curl -f https://api.enterprise.example.com/health || exit 1
        
    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Production deployment ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        
    - name: Create GitHub release
      if: success() && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true

  # Alternative: Deploy to Kubernetes
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: false  # Enable by setting to true and configuring K8s
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
        
    - name: Set K8s context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
        
    - name: Deploy to Kubernetes
      uses: azure/k8s-deploy@v4
      with:
        manifests: |
          k8s/deployment.yaml
          k8s/service.yaml
        images: |
          ghcr.io/${{ github.repository }}:${{ github.sha }}
        namespace: production
        
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/enterprise-api -n production
        kubectl get services -n production

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure()
    needs: [ deploy-production ]
    
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PRODUCTION }}
        
    - name: Rollback swap
      uses: azure/CLI@v1
      with:
        inlineScript: |
          az webapp deployment slot swap \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }} \
            --slot production \
            --target-slot staging
            
    - name: Notify rollback
      uses: 8398a7/action-slack@v3
      with:
        status: 'warning'
        text: 'Production deployment rolled back!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
