# Azure DevOps Pipeline for Enterprise Web API

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - docs/**
      - README.md

pr:
  branches:
    include:
      - main
      - develop

variables:
  solution: 'Enterprise.sln'
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: BuildJob
    displayName: 'Build Solution'
    pool:
      vmImage: $(vmImageName)
    
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: $(dotnetVersion)
        
    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: '$(solution)'
        
    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'
        
    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests'
      inputs:
        command: 'test'
        projects: 'tests/Enterprise.Application.Tests/Enterprise.Application.Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" --logger trx'
        publishTestResults: true
        
    - task: DotNetCoreCLI@2
      displayName: 'Run Integration Tests'
      inputs:
        command: 'test'
        projects: 'tests/Enterprise.Integration.Tests/Enterprise.Integration.Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" --logger trx'
        publishTestResults: true
        
    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Code Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Agent.TempDirectory)/**/*coverage.cobertura.xml'
        
    - task: DotNetCoreCLI@2
      displayName: 'Publish WebApi'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/Enterprise.WebApi/Enterprise.WebApi.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/webapi --no-build'
        zipAfterPublish: true
        
    - task: DotNetCoreCLI@2
      displayName: 'Publish Commands CLI'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/Enterprise.Commands/Enterprise.Commands.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/commands --no-build'
        zipAfterPublish: true
        
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: SecurityScan
  displayName: 'Security and Quality Analysis'
  dependsOn: Build
  jobs:
  - job: SecurityJob
    displayName: 'Security Scanning'
    pool:
      vmImage: $(vmImageName)
    
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: $(dotnetVersion)
        
    - task: DotNetCoreCLI@2
      displayName: 'Check for Vulnerable Packages'
      inputs:
        command: 'custom'
        custom: 'list'
        arguments: 'package --vulnerable --include-transitive'
      continueOnError: true
      
    # Uncomment to enable SonarQube analysis
    # - task: SonarQubePrepare@5
    #   displayName: 'Prepare SonarQube Analysis'
    #   inputs:
    #     SonarQube: 'SonarQubeServiceConnection'
    #     scannerMode: 'MSBuild'
    #     projectKey: 'enterprise-api'
    #     projectName: 'Enterprise API'
    #
    # - task: SonarQubeAnalyze@5
    #   displayName: 'Run SonarQube Analysis'
    #
    # - task: SonarQubePublish@5
    #   displayName: 'Publish SonarQube Results'

- stage: Docker
  displayName: 'Build and Push Docker Image'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DockerJob
    displayName: 'Docker Build and Push'
    pool:
      vmImage: $(vmImageName)
    
    steps:
    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: 'build'
        repository: 'enterprise-api'
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest
          
    - task: Docker@2
      displayName: 'Push to Azure Container Registry'
      inputs:
        command: 'push'
        containerRegistry: 'AzureContainerRegistry'
        repository: 'enterprise-api'
        tags: |
          $(Build.BuildId)
          latest

- stage: DeployStaging
  displayName: 'Deploy to Staging'
  dependsOn: Docker
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployStagingJob
    displayName: 'Deploy to Staging Environment'
    pool:
      vmImage: $(vmImageName)
    environment: 'staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              appName: '$(AzureWebAppNameStaging)'
              containers: '$(ContainerRegistry)/enterprise-api:$(Build.BuildId)'
              
          - task: AzureCLI@2
            displayName: 'Run Database Migrations'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Database migrations would run here"
                # az webapp config connection-string set ...
                
          - task: PowerShell@2
            displayName: 'Health Check'
            inputs:
              targetType: 'inline'
              script: |
                Start-Sleep -Seconds 30
                $response = Invoke-WebRequest -Uri "https://$(AzureWebAppNameStaging).azurewebsites.net/health" -UseBasicParsing
                if ($response.StatusCode -ne 200) {
                  throw "Health check failed with status code: $($response.StatusCode)"
                }
                Write-Host "Health check passed"

- stage: DeployProduction
  displayName: 'Deploy to Production'
  dependsOn: DeployStaging
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProductionJob
    displayName: 'Deploy to Production Environment'
    pool:
      vmImage: $(vmImageName)
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureAppServiceManage@0
            displayName: 'Stop Azure Web App'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              Action: 'Stop Azure App Service'
              WebAppName: '$(AzureWebAppNameProduction)'
              
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              appName: '$(AzureWebAppNameProduction)'
              containers: '$(ContainerRegistry)/enterprise-api:$(Build.BuildId)'
              
          - task: AzureAppServiceManage@0
            displayName: 'Start Azure Web App'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              Action: 'Start Azure App Service'
              WebAppName: '$(AzureWebAppNameProduction)'
              
          - task: PowerShell@2
            displayName: 'Health Check'
            inputs:
              targetType: 'inline'
              script: |
                Start-Sleep -Seconds 30
                $response = Invoke-WebRequest -Uri "https://$(AzureWebAppNameProduction).azurewebsites.net/health" -UseBasicParsing
                if ($response.StatusCode -ne 200) {
                  throw "Health check failed with status code: $($response.StatusCode)"
                }
                Write-Host "Production deployment successful"
                
          - task: GitHubRelease@1
            displayName: 'Create GitHub Release'
            condition: startsWith(variables['Build.SourceBranch'], 'refs/tags/')
            inputs:
              gitHubConnection: 'GitHubServiceConnection'
              repositoryName: '$(Build.Repository.Name)'
              action: 'create'
              target: '$(Build.SourceVersion)'
              tagSource: 'gitTag'
              releaseNotesSource: 'inline'
              releaseNotesInline: 'Production release $(Build.BuildNumber)'
